# Builds a signed release APK when a version tag (v*) is pushed and publishes it as a GitHub Release asset.
# Signing material comes only from repository secrets and exists on the runner only while this job runs.
#
# Secrets (Settings > Secrets and variables > Actions):
#   SKELETON_KEYSTORE_BASE64    the release keystore, base64-encoded (base64 -w0 release.keystore)
#   SKELETON_KEYSTORE_PASSWORD  the keystore password
#   SKELETON_KEY_ALIAS          the key alias
#   SKELETON_KEY_PASSWORD       the key password
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
      CHECK_BASE: origin/develop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the guards diff against a base ref and gitleaks scans the whole history

      - name: The tag must match the app version
        run: |
          version="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Full check (floor guard, ktlint, tests, lint, coverage, APK, gitleaks)
        run: ./scripts/check.sh full

      - name: Write the signing material (runner only, never committed)
        env:
          KEYSTORE_BASE64: ${{ secrets.SKELETON_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SKELETON_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SKELETON_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SKELETON_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::the repository secret SKELETON_$name is not set"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > signing.properties

      - name: Build the signed release APK
        run: ./dev.sh assembleRelease

      - name: Make sure the APK really is signed
        run: |
          # An unsigned build is named app-release-unsigned.apk, so the signed name proves the key was used.
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "skeleton-$TAG.apk"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "skeleton-$TAG.apk" --title "Skeleton $TAG" --generate-notes

      - name: Remove the signing material
        if: always()
        run: rm -f release.keystore signing.properties
