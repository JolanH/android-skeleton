# Runs the full constraint check (CONSTRAINTS.md) in the same Docker images as local development,
# checks the Roborazzi screenshots against the committed references, then publishes the debug APK and the PNGs.
name: build

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the guards diff against a base ref and gitleaks scans the whole history

      - name: Pick the diff base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            base="$BEFORE"
          else
            base="origin/develop"
          fi
          echo "CHECK_BASE=$base" >> "$GITHUB_ENV"
          echo "Diff base: $base"

      - name: Full check (floor guard, ktlint, tests, lint, coverage, APK, gitleaks)
        run: ./scripts/check.sh full

      - name: Verify screenshots against the committed references
        run: ./dev.sh verifyRoborazziDebug

      - name: Upload screenshots
        if: always() # on a mismatch this also carries the *_actual and *_compare images
        uses: actions/upload-artifact@v4
        with:
          name: skeleton-screenshots
          path: app/src/test/screenshots
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: skeleton-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
